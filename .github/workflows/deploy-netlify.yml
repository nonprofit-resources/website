# Deploy via CLI from GitHub Actions — Netlify stays a blank/manual site (no org-repo Git link).
name: Deploy Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          SITE_URL: ${{ vars.SITE_URL || 'https://nonprofit-resources.org' }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || 'https://nonprofit-resources.org' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CATALOG_WEBHOOK_DISPATCH_SECRET: ${{ secrets.CATALOG_WEBHOOK_DISPATCH_SECRET }}
          CATALOG_WEBHOOK_ADMIN_TOKEN: ${{ secrets.CATALOG_WEBHOOK_ADMIN_TOKEN }}
          OSS_FUND_GITHUB_WEBHOOK_SECRET: ${{ secrets.OSS_FUND_GITHUB_WEBHOOK_SECRET }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
          CUSTOMER_IO_SITE_ID: ${{ secrets.CUSTOMER_IO_SITE_ID }}
          CUSTOMER_IO_API_KEY: ${{ secrets.CUSTOMER_IO_API_KEY }}
          CUSTOMER_IO_TRACK_API_KEY: ${{ secrets.CUSTOMER_IO_TRACK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          netlify deploy \
            --dir=dist \
            --functions=.netlify/functions-internal \
            --alias="pr-${{ github.event.pull_request.number }}" \
            --json > deploy.json
          echo "url=$(node -pe 'JSON.parse(require("fs").readFileSync("deploy.json","utf8")).deploy_url')" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            if (!url) return;
            const body = `Netlify preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('Netlify preview:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Sync runtime secrets to Netlify
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          netlify env:set TURSO_DATABASE_URL "${{ secrets.TURSO_DATABASE_URL }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set TURSO_AUTH_TOKEN "${{ secrets.TURSO_AUTH_TOKEN }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set BETTER_AUTH_SECRET "${{ secrets.BETTER_AUTH_SECRET }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set BETTER_AUTH_URL "${{ vars.BETTER_AUTH_URL || 'https://nonprofit-resources.org' }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set ADMIN_EMAILS "${{ secrets.ADMIN_EMAILS }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set CATALOG_WEBHOOK_DISPATCH_SECRET "${{ secrets.CATALOG_WEBHOOK_DISPATCH_SECRET }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set CATALOG_WEBHOOK_ADMIN_TOKEN "${{ secrets.CATALOG_WEBHOOK_ADMIN_TOKEN }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set OSS_FUND_GITHUB_WEBHOOK_SECRET "${{ secrets.OSS_FUND_GITHUB_WEBHOOK_SECRET }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set GITHUB_DISPATCH_TOKEN "${{ secrets.GITHUB_DISPATCH_TOKEN }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set RESEND_API_KEY "${{ secrets.RESEND_API_KEY }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set RESEND_FROM "${{ vars.RESEND_FROM || 'support@updates.nonprofit-resources.org' }}" --site "$NETLIFY_SITE_ID" --force || true
          netlify env:set RESEND_NEWS_AUDIENCE_ID "${{ vars.RESEND_NEWS_AUDIENCE_ID }}" --site "$NETLIFY_SITE_ID" --force || true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          netlify deploy \
            --prod \
            --dir=dist \
            --functions=.netlify/functions-internal \
            --message "github ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Notify catalog webhooks
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.CATALOG_WEBHOOK_DISPATCH_SECRET }}" ]; then
            echo "No dispatch secret; skip"
            exit 0
          fi
          curl -sS -X POST "${SITE_URL}/api/webhooks/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-catalog-webhook-token: ${{ secrets.CATALOG_WEBHOOK_DISPATCH_SECRET }}" \
            -d '{"reason":"deploy ${{ github.sha }}"}'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://nonprofit-resources.org' }}
