# Refresh imported OSS.Fund listings (GitHub Markdown; they have no catalog API).
# Commits directly to main: org policy blocks GITHUB_TOKEN from creating PRs.
name: Sync OSS.Fund

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [oss-fund-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync OSS.Fund directory
        run: pnpm catalog:sync-oss-fund

      - name: Commit import to main if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/oss-fund-seed.generated.ts
          if git diff --staged --quiet; then
            echo "No catalog import changes"
            exit 0
          fi
          git commit -m "Refresh OSS.Fund catalog import."
          # Rebase onto latest main in case another push landed during the job.
          git pull --rebase origin main
          git push origin HEAD:main
