# Refresh imported OSS.Fund listings (GitHub Markdown; they have no catalog API).
name: Sync OSS.Fund

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [oss-fund-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync OSS.Fund directory
        run: pnpm catalog:sync-oss-fund

      - name: Open PR if the import changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/oss-fund-seed.generated.ts
          if git diff --staged --quiet; then
            echo "No catalog import changes"
            exit 0
          fi
          git checkout -B chore/oss-fund-sync
          git commit -m "Refresh OSS.Fund catalog import."
          git push -u origin HEAD --force-with-lease || git push -u origin HEAD
          if ! gh pr list --head chore/oss-fund-sync --state open --json number --jq 'length' | grep -q '^[1-9]'; then
            gh pr create \
              --title "Refresh OSS.Fund catalog import" \
              --body "Automated import from [oss-fund/directory](https://github.com/oss-fund/directory) (CC BY 4.0). OSS.Fund does not publish an HTTP API; this job clones their GitHub posts."
          fi
